<div class="d-flex flex-column min-vh-100">
  <!-- Header -->
  <app-header></app-header>

  <!-- Main Content Section -->
  <div class="d-flex flex-column flex-grow-1">
    
    <!-- Hero Section -->
    <section class="hero-section" style="height: 300px; background-image: url({{ images[currentImageIndex] }}); background-size: cover; background-position: center;">
      <div class="hero-overlay d-flex flex-column align-items-center justify-content-center h-100 text-white text-center">
        <h1>Willkommen bei der Künstlerin!</h1>
        <p>Entdecke die Welt der Kunst und Inspiration</p>
      </div>
    </section>

    <!-- Content: Nav + Main -->
    <div class="d-flex flex-grow-1">
      <!-- Navigation links -->
      <aside class="bg-light p-3 border-end" style="min-width: 200px;">
        <app-navigation></app-navigation>
      </aside>

      <!-- Main Content rechts -->
      <main class="flex-grow-1 p-4">
        <router-outlet></router-outlet> <!-- Hier wird die Galerie oder eine andere Seite geladen -->
      </main>
    </div>
  </div>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
