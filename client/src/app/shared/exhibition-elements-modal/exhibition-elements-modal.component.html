<div class="modal fade show" tabindex="-1" style="display: block; background: rgba(0,0,0,0.7);" *ngIf="element"
    (click)="onClose()">
    <div class="modal-dialog modal-lg modal-dialog-centered" (click)="$event.stopPropagation()">
        <div class="modal-content">
            <div class="modal-header">
                <div *ngIf="element">
                    <h5 class="modal-title">{{ element.name }}</h5>
                </div>
                <button type="button" class="btn-close" (click)="onClose()"></button>
            </div>
            <div class="modal-body">
                <img [src]="element.imageUrl" [alt]="element.name" class="modal-image" (error)="onImageError($event)" />
                <div *ngIf="element">
                    <p class="mt-3">{{ element.description }}</p>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <div *ngIf="element">
                        <p class="mb-0 d-flex align-items-center gap-2">
                            <i class="fas fa-circle"
                                [ngClass]="element.availableToBuy ? 'text-success' : 'text-danger'"></i>
                            {{ element.availableToBuy ? 'Verfügbar' : 'Nicht verfügbar' }}
                        </p>
                    </div>
                    <div *ngIf="element">
                        <p *ngIf="element.availableToBuy" class="mb-0">
                            <strong>Preis:</strong> {{ element.priceTag }} €
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
