<div class="table-responsive">
  <table class="table table-bordered table-hover">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Benutzername</th>
        <th>Rolle</th>
        <th>Aktionen</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of pagedUsers">
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.role }}</td>
        <td>
          <button
            class="btn btn-danger btn-sm"
            (click)="deleteUser(user)"
            *ngIf="canDelete(user)">
            Löschen
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Pagination -->
<nav class="mt-3">
  <ul class="pagination">
    <li class="page-item" [class.disabled]="currentPage === 1">
      <button class="page-link" (click)="setPage(currentPage - 1)">Zurück</button>
    </li>
    <li
      class="page-item"
      *ngFor="let page of [].constructor(Math.ceil(users.length / pageSize)); let i = index"
      [class.active]="currentPage === i + 1">
      <button class="page-link" (click)="setPage(i + 1)">{{ i + 1 }}</button>
    </li>
    <li class="page-item" [class.disabled]="currentPage >= Math.ceil(users.length / pageSize)">
      <button class="page-link" (click)="setPage(currentPage + 1)">Weiter</button>
    </li>
  </ul>
</nav>

<!-- Add user -->
<button class="btn btn-primary mt-3" (click)="showAddUserModal = true">Benutzer hinzufügen</button>

<!-- AddUserDialog -->
<app-add-user-dialog
  *ngIf="showAddUserModal"
  [existingUsers]="users"
  (userCreated)="addUser($event)"
  (close)="showAddUserModal = false">
</app-add-user-dialog>

<!-- Confirm Delete Dialog -->
<app-confirm-dialog
  [show]="showConfirmDialog"
  title="Benutzer löschen"
  [message]="'Möchtest du den Benutzer »' + selectedUserToDelete?.username + '« wirklich löschen?'"
  confirmText="Löschen"
  [confirmClass]="'btn-danger'"
  cancelText="Abbrechen"
  (confirm)="confirmDeleteUser()"
  (cancel)="cancelDeleteUser()">
</app-confirm-dialog>
