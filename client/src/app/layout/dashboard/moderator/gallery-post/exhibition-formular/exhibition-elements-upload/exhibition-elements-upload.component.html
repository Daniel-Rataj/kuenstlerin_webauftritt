<div class="form-group" style="max-width: 50%;">
  <label for="fileUpload" class="form-label">
    Bilder auswählen
    <input id="fileUpload" type="file" class="form-control d-block w-100" (change)="onFilesSelected($event)" multiple />
  </label>
</div>

<div *ngIf="metadataList.length === 0" class="text-muted mt-2">
  Noch keine Dateien ausgewählt.
</div>

<div *ngFor="let element of metadataList; let i = index" class="card mt-4">
  <div class="card-body">
    <div class="d-flex justify-content-between">
      <h5 class="card-title">Bild {{ i + 1 }}</h5>
      <button class="btn btn-sm btn-outline-danger" (click)="remove(i)">
        <i class="bi bi-trash"></i> Entfernen
      </button>
    </div>

    <!-- Name + Preis nebeneinander -->
    <div class="d-flex flex-wrap gap-4 mt-3">
      <label class="form-label" style="flex: 1; min-width: 250px; max-width: 300px;">
        Name
        <input type="text" class="form-control d-block w-100" [(ngModel)]="element.name" />
        <div class="form-text text-danger" *ngIf="element.name.trim() === ''">
          Name ist erforderlich.
        </div>
      </label>

      <label class="form-label" style="flex: 1; min-width: 250px; max-width: 300px;">
        Preis (€)
        <input type="number" class="form-control d-block w-100" [(ngModel)]="element.priceTag" placeholder="Optional" />
      </label>
    </div>

    <!-- Länge + Breite nebeneinander -->
    <div class="d-flex flex-wrap gap-4 mt-3">
      <label class="form-label" style="flex: 1; min-width: 250px; max-width: 300px;">
        Länge in cm
        <input type="number" class="form-control d-block w-100" [(ngModel)]="element.length" />
        <div class="form-text text-danger" *ngIf="showLengthError(element)">
          Länge ist erforderlich
        </div>
      </label>

      <label class="form-label" style="flex: 1; min-width: 250px; max-width: 300px;">
        Breite in cm
        <input type="number" class="form-control d-block w-100" [(ngModel)]="element.width" />
        <div class="form-text text-danger" *ngIf="showWidthError(element)">
          Breite ist erforderlich
        </div>
      </label>
    </div>

    <!-- Beschreibung -->
    <label class="form-label mt-3" style="width: 100%;">
      Beschreibung
      <textarea rows="3" class="form-control d-block w-100" [(ngModel)]="element.description"></textarea>
      <div class="form-text text-danger" *ngIf="element.description.trim() === ''">
        Beschreibung ist erforderlich.
      </div>
    </label>

    <!-- Checkbox -->
    <div class="form-check mt-3">
      <label class="form-check-label" for="available-{{ i }}">
        <input class="form-check-input" type="checkbox" [(ngModel)]="element.availableToBuy" id="available-{{ i }}" />
        Zum Verkauf verfügbar
      </label>
    </div>

    <!-- Datei-Info -->
    <div *ngIf="element.imageFile || element.imageUrl" class="col-12 mt-2">
      <strong>Datei:</strong>
      <span *ngIf="element.imageFile">{{ element.imageFile.name }}</span>
      <span *ngIf="!element.imageFile && element.imageUrl">{{ element.imageUrl }}</span>
    </div>
  </div>
</div>
