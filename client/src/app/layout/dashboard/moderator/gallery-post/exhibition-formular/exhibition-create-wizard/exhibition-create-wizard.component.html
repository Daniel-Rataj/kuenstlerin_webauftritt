<div class="container mt-4">
  <!-- Kopfbereich -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Neue Ausstellung erstellen</h3>
    <button class="btn btn-outline-danger" (click)="cancelCreation()">
      <i class="fa-solid fa-xmark"></i> Abbrechen
    </button>
  </div>

  <!-- Formular-Schritte -->
  <ng-container [ngSwitch]="step">
    <app-exhibition-basic-form
      *ngSwitchCase="1"
      [exhibition]="exhibitionDraft"
      (exhibitionDraftSubmitted)="handleBasicDataSubmitted($event)">
    </app-exhibition-basic-form>

    <app-exhibition-elements-upload
      *ngSwitchCase="2"
      [exhibitionDraft]="exhibitionDraft"
      [metadataList]="metadataList"
      (exhibitionElementsSubmitted)="assignExhibitionElements($event)">
    </app-exhibition-elements-upload>

    <app-exhibition-publish
      *ngSwitchCase="3"
      [exhibitionDraft]="exhibitionDraft"
      [metadataList]="metadataList"
      (finished)="handleFinished()"> <!-- 💡 Hier die neue Eventbindung -->
    </app-exhibition-publish>
  </ng-container>

  <!-- Schritte-Navigation -->
  <div class="mt-4 d-flex justify-content-between align-items-center">
    <button
      class="btn btn-secondary"
      (click)="goBack()"
      *ngIf="step > 1">
      <i class="fa-solid fa-arrow-left"></i> Zurück
    </button>

    <div class="text-center flex-grow-1">
      <p class="mb-0 fw-semibold">Schritt {{ step }} von 3</p>
    </div>

    <button
      class="btn btn-primary"
      (click)="submitExhibitionCreationForm()"
      *ngIf="step === 1">
      Weiter <i class="fa-solid fa-arrow-right ms-1"></i>
    </button>
  </div>
</div>
