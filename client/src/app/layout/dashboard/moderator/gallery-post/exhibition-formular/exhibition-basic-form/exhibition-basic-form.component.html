<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="title" class="form-label">Titel der Ausstellung</label>
    <input
      id="title"
      type="text"
      formControlName="title"
      class="form-control"
      [class.is-invalid]="form.get('title')?.invalid && form.get('title')?.touched"
    />
    <div class="invalid-feedback" *ngIf="form.get('title')?.hasError('required')">
      Titel ist erforderlich.
    </div>
  </div>

  <div class="mb-3">
    <label for="date" class="form-label">Datum</label>
    <input
      id="date"
      type="date"
      formControlName="date"
      class="form-control"
      [readonly]="true"
    />

    <div class="form-text text-muted">
      {{ form.get('date')?.value
        ? 'Datum wurde automatisch gesetzt.'
        : 'Optional: Wird automatisch gesetzt bei fertigstellung des Entwurfs oder der Veröffentlichung.' }}
    </div>
  </div>

</form>
