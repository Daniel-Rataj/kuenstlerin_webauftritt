<app-dashboard-header [title]="'Artikel der Startseite zuweisen'"></app-dashboard-header>

<!-- Breadcrumb and Backnavigation -->
<app-dashboard-toolbar [breadcrumbs]="['Dashboard', 'Artikel zuweisen']"></app-dashboard-toolbar>

<div class="row">
  <div  class="col-md-4 mb-4" *ngFor="let section of sections; let i = index">
    <div class="card">
      <div class="card-body d-flex flex-column">
        <div class="me-3 mb-0">{{ section.label }}</div>
        <p class="card-text">Diesem Abschnitt kann ein Artikel zugewiesen werden.</p>
        <button class="btn btn-primary mt-auto align-self-start" (click)="navigateToAssignment(i.toString())">Zuweisen</button>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
