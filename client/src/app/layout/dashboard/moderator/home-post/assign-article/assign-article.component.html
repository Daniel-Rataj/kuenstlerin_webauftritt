<app-dashboard-header [title]="'Artikel der Startseite zuweisen'"></app-dashboard-header>

<app-dashboard-toolbar
  *ngIf="sectionLabel"
  [breadcrumbs]="['Dashboard', 'Artikel zuweisen', sectionLabel]"
></app-dashboard-toolbar>

<div class="mb-3" style="max-width: 50%;">
  <label for="articleSelect">Artikel auswählen</label>
  <select
    id="articleSelect"
    class="form-select"
    [(ngModel)]="selectedArticleId"
    [ngModelOptions]="{ standalone: true }"
  >
    <option [ngValue]="null" disabled>-- auswählen --</option>
    <option *ngFor="let a of articles" [ngValue]="a.id">{{ a.title }}</option>
  </select>
  <div class="form-text text-muted">
    Der ausgewählte Artikel wird auf der Startseite angezeigt
  </div>
</div>

<div class="form-check mb-2">
  <input
    class="form-check-input"
    type="checkbox"
    [(ngModel)]="showButton"
    [ngModelOptions]="{ standalone: true }"
    id="btnAdd"
  />
  <label class="form-check-label" for="btnAdd">Button hinzufügen</label>
</div>

<div *ngIf="showButton" class="mb-3" style="max-width: 50%;">
  <label for="targetRouteSelect">Auf welche Seite soll der Button führen?</label>
  <select
    id="targetRouteSelect"
    class="form-select"
    [(ngModel)]="buttonTargetRoute"
    [ngModelOptions]="{ standalone: true }"
  >
    <option [ngValue]="null" disabled>-- auswählen --</option>
    <option *ngFor="let route of pageRoutes" [ngValue]="route.path">
      {{ route.label }}
    </option>
  </select>
</div>

<button class="btn btn-primary" (click)="saveArticleAssignment()">
  Speichern
</button>
