<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 mb-4">
      <h2 class="mb-3" style="font-weight:700; color:#222;">Kontakt</h2>
      <p>Bei Interesse oder Fragen können Sie mir gerne schreiben.</p>
      <p><strong>Adresse:</strong><br>
        Tatjana Lindenau<br>
        94469 Deggendorf, Deutschland<br>
      </p>
      <p><strong>E-Mail:</strong><br>
        <a href="mailto:lindenau&#64;gmail.com" class="text-primary">lindenau&#64;gmail.com</a>
      </p>
      <p><strong>Telefon:</strong><br>
        <a href="tel:+491234567890" class="text-primary">+49 123 4567890</a>
      </p>
    </div>

    <div class="col-lg-6">
      <!-- TODO: "https://formspree.io/f/DEIN-FORMULAR-ID-HIER" muss ersetzt werden mit dem echten Formspree-Formular-Link -->
      <form
        action="https://formspree.io/f/DEIN-FORMULAR-ID-HIER"
        method="POST"
        class="bg-white p-4 rounded shadow-sm"
      >
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Name</label>
          <input type="text" id="name" class="form-control" name="name" required />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">E-Mail</label>
          <input type="email" id="email" class="form-control" name="email" required />
        </div>

        <div class="mb-3">
          <label for="subject" class="form-label fw-semibold">Betreff</label>
          <input type="text" id="subject" class="form-control" name="subject" required />
        </div>

        <div class="mb-3">
          <label for="message" class="form-label fw-semibold">Nachricht</label>
          <textarea
            id="message"
            rows="5"
            class="form-control"
            name="message"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Absenden</button>
      </form>
    </div>
  </div>
</div>
