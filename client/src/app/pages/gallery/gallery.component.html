<div class="gallery-container">
  <app-exhibition-grid
    *ngFor="let exhibition of exhibitions"
    [exhibition]="exhibition"
    (elementClicked)="openModal($event)">
  </app-exhibition-grid>
</div>

<!-- Modal Overlay -->
<app-exhibition-elements-modal
  *ngIf="selectedElement"
  [element]="selectedElement"
  (close)="closeModal()">
</app-exhibition-elements-modal>
